{% extends "base.html" %}
{% block title %}Add performance · Tinshed Players{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Add performance — {{ production.title }}</h1>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Date *</label>
    <input class="form-control" name="date" type="date" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Start time *</label>
    <input class="form-control" name="start_time" type="time" required>
  </div>
  <fieldset class="mb-3">
    <legend class="fs-6">Crew call (roles and how many are needed)</legend>
    <div class="row g-2 mb-2">
      <div class="col-8"><input class="form-control form-control-sm" name="role" placeholder="Role, e.g. Sound Op"></div>
      <div class="col-4"><input class="form-control form-control-sm" name="count" type="number" min="1" value="1" placeholder="Count"></div>
    </div>
    <div class="row g-2 mb-2">
      <div class="col-8"><input class="form-control form-control-sm" name="role" placeholder="Role"></div>
      <div class="col-4"><input class="form-control form-control-sm" name="count" type="number" min="1" value="1" placeholder="Count"></div>
    </div>
  </fieldset>
  <button class="btn btn-primary" type="submit">Save</button>
  <a class="btn btn-link" href="{{ url_for('productions.production_detail', production_id=production.id) }}">Cancel</a>
</form>
{% endblock %}
