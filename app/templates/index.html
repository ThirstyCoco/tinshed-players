{% extends "base.html" %}
{% block content %}
<div class="row g-3">
  <div class="col-md-4">
    <div class="card h-100">
      <div class="card-body">
        <h5 class="card-title">Volunteers</h5>
        <p class="card-text">Add and manage the people who crew shows.</p>
        <a href="{{ url_for('volunteers.list_volunteers') }}" class="btn btn-primary">Open</a>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card h-100">
      <div class="card-body">
        <h5 class="card-title">Productions</h5>
        <p class="card-text">Season schedule, performances and crew calls.</p>
        <a href="{{ url_for('productions.list_productions') }}" class="btn btn-primary">Open</a>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card h-100">
      <div class="card-body">
        <h5 class="card-title">Assignments</h5>
        <p class="card-text">Who is doing what, on which performance.</p>
        <a href="{{ url_for('assignments.list_assignments') }}" class="btn btn-primary">Open</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
